services:
  ovos_messagebus:
    image: smartgic/ovos-messagebus:testing
    container_name: ovos_messagebus
    restart: unless-stopped
    network_mode: host                # Required for your current setup
    environment:
      - TZ=Europe/Berlin
      - OVOS_BUS_HOST=127.0.0.1       # Listen on local loopback
    volumes:
      - ~/ovos/config:/home/ovos/.config/mycroft
    
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('127.0.0.1', 8181))"]
      interval: 5s
      timeout: 2s
      retries: 5

  ovos_core:
    image: smartgic/ovos-core:testing
    container_name: ovos_core
    restart: unless-stopped
    network_mode: host                # Must match the bus
    environment:
      - TZ=Europe/Berlin
      - OVOS_BUS_HOST=127.0.0.1       # Look for bus on the host's localhost
    depends_on:
      ovos_messagebus:
        condition: service_healthy
    volumes:
      - ~/ovos/config:/home/ovos/.config/mycroft
      - ~/ovos/persistence/core:/home/ovos/.local/share/mycroft

  ## TTS section
  ovos_audio:
    image: smartgic/ovos-audio:testing
    container_name: ovos_audio
    build:
      context: .
      dockerfile: Dockerfile.audio
    restart: unless-stopped
    network_mode: host
    # 1. Add group permissions
    group_add:
      - audio
    depends_on:
      ovos_messagebus:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - OVOS_BUS_HOST=127.0.0.1
      # 2. Tell the container to use the host's PulseAudio/PipeWire server
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - /etc/asound.conf:/etc/asound.conf:ro
      - /etc/alsa:/etc/alsa:ro
      - /usr/share/alsa:/usr/share/alsa:ro
      - ~/ovos/config:/home/ovos/.config/mycroft
      - ~/models/piper:/home/ovos/models/piper:ro
      - ~/ovos/persistence/audio:/home/ovos/.local
      - ~/ovos/sounds:/home/ovos/.local/share/mycroft/sounds:ro
      
  ## stt section
  ovos_listener:
    image: ovos-listener:testing
    container_name: ovos_listener
    build: 
      context: .
      dockerfile: Dockerfile.listener
    restart: unless-stopped
    network_mode: host                # ADD THIS LINE
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_core:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    ipc: host
    privileged: true # Often required on Pi 5 for hardware access control
    group_add:
      - audio
    environment:
      - TZ=Europe/Berlin              # Changed to match your other services
      - OVOS_BUS_HOST=127.0.0.1
      - PULSE_SERVER=unix:/run/user/1000/pulse/native    # If using PulseAudio/Pipewire
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ~/ovos/config:/home/ovos/.config/mycroft
      - ~/models/wakewords:/home/ovos/.local/share/mycroft
      - ~/ovos/persistence/listener:/home/ovos/.local
      - ~/ovos/sounds:/home/ovos/.local/share/mycroft/sounds:ro
      - /run/user/1000/pulse:/run/1000/ovos/pulse
      - /etc/asound.conf:/etc/asound.conf:ro
      - /etc/alsa:/etc/alsa:ro
      - /usr/share/alsa:/usr/share/alsa:ro

  ovos_cli:
      image: smartgic/ovos-cli:testing
      container_name: ovos_cli
      build: 
        context: .
        dockerfile: Dockerfile.cli
      restart: unless-stopped
      network_mode: host                # ADD THIS LINE
      depends_on:
        ovos_messagebus:
          condition: service_healthy
      environment:
        - TZ=Europe/Berlin              # Changed to match your other services
        - OVOS_BUS_HOST=127.0.0.1
      devices:
        - /dev/snd:/dev/snd
      volumes:
        - ~/ovos/config:/home/ovos/.config/mycroft
        - ~/ovos/persistence/listener:/home/ovos/.local

  ovos_skill_vehicle_control:
    build:
      context: /home/ovos/ovos-docker-install/ovos-skill-vehicle-control
      dockerfile: Dockerfile.vehicle_skill
    container_name: ovos_skill_vehicle_control
    restart: unless-stopped
    network_mode: host
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_listener:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - OVOS_BUS_HOST=127.0.0.1
    volumes:
      - ~/ovos/config:/home/ovos/.config/mycroft
      - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
    devices:
      - /dev/snd:/dev/snd  

  ovos_skill_test:
    build:
      context: /home/ovos/ovos-docker-install/ovos-skill-test
      dockerfile: Dockerfile.test_skill
    container_name: ovos_skill_test
    restart: unless-stopped
    network_mode: host
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_listener:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - OVOS_BUS_HOST=127.0.0.1
    volumes:
      - ~/ovos/config:/home/ovos/.config/mycroft
      - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
    devices:
      - /dev/snd:/dev/snd  

  ovos_skill_hello_world:
    build:
      context: /home/ovos/ovos-docker-install/ovos-skill-hello-world
      dockerfile: Dockerfile.hello_world_skill
    container_name: ovos_skill_hello_world
    restart: unless-stopped
    network_mode: host
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_listener:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - OVOS_BUS_HOST=127.0.0.1
    volumes:
      - ~/ovos/config:/home/ovos/.config/mycroft
      - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
    devices:
      - /dev/snd:/dev/snd 

  ovos_voice_server:
    build:
      context: ./voice-server
      dockerfile: Dockerfile.voice_server
    container_name: ovos_voice_server
    restart: unless-stopped
    network_mode: host
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_listener:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - VOICE_SERVER_PORT=6000
    volumes:
      - ~/ovos/sounds:/home/ovos/sounds:ro
      - ~/ovos/sounds:/home/ovos/.local/share/mycroft/sounds:ro


  ovos_skill_date_time:
      image: smartgic/ovos-skill-date-time:testing
      container_name: ovos_skills_date_time
      restart: unless-stopped
      volumes:
        - ~/ovos/config:/home/ovos/.config/mycroft
        - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
      network_mode: host                # ADD THIS LINE
      depends_on:
        ovos_messagebus:
          condition: service_healthy
      environment:
        - TZ=Europe/Berlin              # Changed to match your other services
        - OVOS_BUS_HOST=127.0.0.1
        - PIP_INSTALL=ovos-skill-date-time
      devices:
        - /dev/snd:/dev/snd

  ovos-skill-fallback-unknown:
      build:
        context: /home/ovos/ovos-docker-install/ovos-skill-fallback-unknown
        dockerfile: Dockerfile.unknown_skill
      container_name: ovos-skill-fallback-unknown
      restart: unless-stopped
      volumes:
        - ~/ovos/config:/home/ovos/.config/mycroft
        - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
      network_mode: host                # ADD THIS LINE
      depends_on:
        ovos_messagebus:
          condition: service_healthy
      environment:
        - TZ=Europe/Berlin              # Changed to match your other services
        - OVOS_BUS_HOST=127.0.0.1
        - PIP_INSTALL=ovos-skill-fallback-unknown
      devices:
        - /dev/snd:/dev/snd
    