
services:
  ovos_messagebus:
    image: smartgic/ovos-messagebus:testing
    container_name: ovos_messagebus
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Berlin
      OVOS_BUS_HOST: 127.0.0.1
    volumes:
      - ${HOME}/ovos/config:/home/ovos/.config/mycroft

  ovos_core:
    image: smartgic/ovos-core:testing
    container_name: ovos_core
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Berlin
      OVOS_BUS_HOST: 127.0.0.1
    depends_on:
      ovos_messagebus:
        condition: service_healthy
    volumes:
      - ${HOME}/ovos/config:/home/ovos/.config/mycroft
      - ${HOME}/ovos/persistence/core:/home/ovos/.local/share/mycroft

  ovos_audio:
    image: ovos-audio:testing
    build:
      context: .
      dockerfile: Dockerfile.audio
    container_name: ovos_audio
    restart: unless-stopped
    network_mode: host
    group_add:
      - audio
    depends_on:
      ovos_messagebus:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      OVOS_BUS_HOST: 127.0.0.1
      PHOONNX_PREFETCH_VOICES: OpenVoiceOS/pipertts_de-DE_miro
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ${HOME}/ovos/phoonnx-cache:/home/ovos/.cache
      - /etc/asound.conf:/etc/asound.conf:ro
      - /etc/alsa:/etc/alsa:ro
      - /usr/share/alsa:/usr/share/alsa:ro
      - ${HOME}/ovos/config:/home/ovos/.config/mycroft
      - ${HOME}/ovos/model/phoonnx:/home/ovos/model/phoonnx
      - ${HOME}/ovos/sounds:/home/ovos/sounds:ro

  ovos_listener:
    image: ovos-listener:testing
    build:
      context: .
      dockerfile: Dockerfile.listener
    container_name: ovos_listener
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    group_add:
      - audio
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_core:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      OVOS_BUS_HOST: 127.0.0.1
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ${HOME}/ovos/config:/home/ovos/.config/mycroft
      - ${HOME}/models/wakewords:/home/ovos/.local/share/mycroft
      - ${HOME}/ovos/persistence/listener:/home/ovos/.local
      - ${HOME}/ovos/sounds:/home/ovos/sounds:ro
      - /run/user/1000/pulse:/run/1000/ovos/pulse
      - /etc/asound.conf:/etc/asound.conf:ro
      - /etc/alsa:/etc/alsa:ro
      - /usr/share/alsa:/usr/share/alsa:ro

  ovos_cli:
    image: smartgic/ovos-cli:testing
    container_name: ovos_cli
    restart: unless-stopped
    network_mode: host
    depends_on:
      ovos_messagebus:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      OVOS_BUS_HOST: 127.0.0.1
    volumes:
      - ${HOME}/ovos/config:/home/ovos/.config/mycroft
      - ${HOME}/ovos/persistence/listener:/home/ovos/.local

  ovos_skill_vehicle_control:
    build:
      context: /home/ovos/ovos-docker-install/ovos-skill-vehicle-control
      dockerfile: Dockerfile.vehicle_skill
    container_name: ovos_skill_vehicle_control
    restart: unless-stopped
    network_mode: host
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_listener:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - OVOS_BUS_HOST=127.0.0.1
    volumes:
      - ~/ovos/config:/home/ovos/.config/mycroft
      - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
    devices:
      - /dev/snd:/dev/snd  

  ovos_skill_test:
    build:
      context: /home/ovos/ovos-docker-install/ovos-skill-test
      dockerfile: Dockerfile.test_skill
    container_name: ovos_skill_test
    restart: unless-stopped
    network_mode: host
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_listener:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - OVOS_BUS_HOST=127.0.0.1
    volumes:
      - ~/ovos/config:/home/ovos/.config/mycroft
      - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
    devices:
      - /dev/snd:/dev/snd  

  ovos_skill_hello_world:
    build:
      context: /home/ovos/ovos-docker-install/ovos-skill-hello-world
      dockerfile: Dockerfile.hello_world_skill
    container_name: ovos_skill_hello_world
    restart: unless-stopped
    network_mode: host
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_listener:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - OVOS_BUS_HOST=127.0.0.1
    volumes:
      - ~/ovos/config:/home/ovos/.config/mycroft
      - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
    devices:
      - /dev/snd:/dev/snd 

  ovos_voice_server:
    build:
      context: ./voice-server
      dockerfile: Dockerfile.voice_server
    container_name: ovos_voice_server
    restart: unless-stopped
    network_mode: host
    depends_on:
      ovos_messagebus:
        condition: service_healthy
      ovos_listener:
        condition: service_healthy
      ovos_audio:
        condition: service_healthy
    environment:
      - TZ=Europe/Berlin
      - VOICE_SERVER_PORT=6000
    volumes:
      - ~/ovos/sounds:/home/ovos/sounds:ro
      - ~/ovos/sounds:/home/ovos/.local/share/mycroft/sounds:ro

  phoonnx_server:
    build:
      context: ./oonnx-voice-server
      dockerfile: Dockerfile.phoonnx_server
    container_name: phoonnx_server
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Berlin
      - VOICE_SERVER_PORT=6000
      - PHOONNX_PREFETCH_VOICES=OpenVoiceOS/pipertts_de-DE_miro
      - PYTHONUNBUFFERED=1
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ${HOME}/ovos/phoonnx-cache:/home/ovos/.cache
      - ${HOME}/model:/home/ovos/model
      - /etc/asound.conf:/etc/asound.conf:ro
      - /etc/alsa:/etc/alsa:ro
      - /usr/share/alsa:/usr/share/alsa:ro

  ovos_skill_date_time:
      image: smartgic/ovos-skill-date-time:testing
      container_name: ovos_skills_date_time
      restart: unless-stopped
      volumes:
        - ~/ovos/config:/home/ovos/.config/mycroft
        - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
      network_mode: host                # ADD THIS LINE
      depends_on:
        ovos_messagebus:
          condition: service_healthy
      environment:
        - TZ=Europe/Berlin              # Changed to match your other services
        - OVOS_BUS_HOST=127.0.0.1
        - PIP_INSTALL=ovos-skill-date-time
      devices:
        - /dev/snd:/dev/snd

  ovos-skill-fallback-unknown:
      build:
        context: /home/ovos/ovos-docker-install/ovos-skill-fallback-unknown
        dockerfile: Dockerfile.unknown_skill
      container_name: ovos-skill-fallback-unknown
      restart: unless-stopped
      volumes:
        - ~/ovos/config:/home/ovos/.config/mycroft
        - ~/ovos/ovos-share:/home/ovos/.local/share/mycroft
      network_mode: host                # ADD THIS LINE
      depends_on:
        ovos_messagebus:
          condition: service_healthy
      environment:
        - TZ=Europe/Berlin              # Changed to match your other services
        - OVOS_BUS_HOST=127.0.0.1
        - PIP_INSTALL=ovos-skill-fallback-unknown
      devices:
        - /dev/snd:/dev/snd

    